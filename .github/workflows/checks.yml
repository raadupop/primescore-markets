name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/classification/requirements.txt
            apps/classification/requirements-dev.txt
      - name: Install runtime and validation dependencies
        run: python -m pip install -r apps/classification/requirements-dev.txt
      - name: Contracts, fitness functions and tests
        run: bash harness/check-suite.sh
